title: DNS Tunneling via Long Subdomain Queries
id: c3d4e5f6-a7b8-9012-cdef-345678901234
status: production
description: |
  Detects DNS tunneling by identifying unusually long subdomain queries
  or high query frequency to the same domain. Used by tools like iodine, dnscat2.
  MITRE ATT&CK: T1071.004 (DNS)
author: SOC Lab
date: 2024/01/01
tags:
  - attack.command_and_control
  - attack.exfiltration
  - attack.t1071.004
  - attack.t1048.003
logsource:
  category: dns
  product: zeek
detection:
  long_query:
    query|re: '^[a-z0-9]{40,}\.'
  high_entropy_label:
    query|re: '^[a-z0-9+/=]{30,}\.'
  condition: long_query or high_entropy_label
falsepositives:
  - Some CDN providers use long subdomains
  - ACME challenge domains for SSL certificates
  - Some legitimate SaaS platforms
level: medium
