title: Reverse Shell Process Detection
id: b2c3d4e5-f6a7-8901-bcde-f23456789012
status: production
description: |
  Detects reverse shell spawned from web server or suspicious parent processes.
  Covers bash, sh, python, perl, nc shells spawned by web servers.
  MITRE ATT&CK: T1059 (Command and Scripting Interpreter), T1505.003 (Web Shell)
author: SOC Lab
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059
  - attack.persistence
  - attack.t1505.003
logsource:
  category: process_creation
  product: linux
detection:
  shell_process:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
      - '/zsh'
      - '/python'
      - '/python3'
      - '/perl'
      - '/ruby'
      - '/nc'
      - '/ncat'
  webserver_parent:
    ParentImage|endswith:
      - '/apache2'
      - '/nginx'
      - '/httpd'
      - '/php'
      - '/php-fpm'
      - '/node'
      - '/java'
  reverse_shell_args:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
      - 'bash -i'
      - 'sh -i'
      - ' -e /bin/bash'
      - ' -e /bin/sh'
  condition: shell_process and (webserver_parent or reverse_shell_args)
falsepositives:
  - Legitimate web server scripts that spawn shells (should be reviewed)
  - Deployment scripts
level: high
