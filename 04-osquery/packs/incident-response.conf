{
  "queries": {
    "ir_process_tree": {
      "query": "SELECT p.pid, p.parent AS ppid, p.name, p.path, p.cmdline, p.uid, p.gid, p.start_time, pp.name AS parent_name, pp.path AS parent_path, pp.cmdline AS parent_cmdline FROM processes p LEFT JOIN processes pp ON p.parent = pp.pid ORDER BY p.start_time DESC;",
      "interval": 30,
      "description": "IR: Full process tree snapshot"
    },
    "ir_active_connections": {
      "query": "SELECT p.name, p.pid, p.path, p.cmdline, p.uid, n.family, n.protocol, n.local_address, n.local_port, n.remote_address, n.remote_port, n.state FROM process_open_sockets n JOIN processes p ON n.pid = p.pid WHERE n.state = 'ESTABLISHED' OR n.state = 'LISTEN';",
      "interval": 30,
      "description": "IR: All active network connections"
    },
    "ir_open_files": {
      "query": "SELECT p.name, p.pid, pof.path, pof.fd FROM process_open_files pof JOIN processes p ON pof.pid = p.pid WHERE pof.path NOT LIKE '/proc/%' AND pof.path NOT LIKE '/sys/%' AND pof.path NOT LIKE '/dev/%' ORDER BY p.name;",
      "interval": 60,
      "description": "IR: Open file handles per process"
    },
    "ir_loaded_modules": {
      "query": "SELECT name, size, used_by, status FROM kernel_modules ORDER BY name;",
      "interval": 60,
      "description": "IR: Loaded kernel modules (rootkit check)"
    },
    "ir_logged_in_users": {
      "query": "SELECT type, user, host, time, tty, pid FROM logged_in_users ORDER BY time DESC;",
      "interval": 30,
      "description": "IR: Currently logged-in users"
    },
    "ir_recent_commands": {
      "query": "SELECT uid, username, time, command FROM shell_history ORDER BY time DESC LIMIT 200;",
      "interval": 60,
      "description": "IR: Recent shell command history"
    },
    "ir_startup_items": {
      "query": "SELECT * FROM startup_items;",
      "interval": 300,
      "description": "IR: All startup items (systemd, init, launchd)"
    },
    "ir_crontab_full": {
      "query": "SELECT * FROM crontab;",
      "interval": 120,
      "description": "IR: Full crontab for all users"
    },
    "ir_file_events": {
      "query": "SELECT path, action, transaction_id, atime, mtime, ctime, md5, sha256, inode, uid, gid, mode FROM file_events WHERE path NOT LIKE '/proc/%' ORDER BY action_time DESC LIMIT 500;",
      "interval": 30,
      "description": "IR: FIM file change events"
    },
    "ir_dns_cache": {
      "query": "SELECT * FROM dns_resolvers;",
      "interval": 60,
      "description": "IR: Current DNS resolver configuration"
    },
    "ir_arp_cache": {
      "query": "SELECT * FROM arp_cache;",
      "interval": 60,
      "description": "IR: ARP cache (detect ARP spoofing)"
    },
    "ir_interface_addresses": {
      "query": "SELECT a.interface, a.address, a.mask, a.broadcast, i.type, i.description FROM interface_addresses a JOIN interface_details i ON a.interface = i.interface;",
      "interval": 120,
      "description": "IR: Network interfaces and addresses"
    },
    "ir_iptables": {
      "query": "SELECT filter_name, chain, policy, target, match_iptables FROM iptables WHERE filter_name != 'OUTPUT';",
      "interval": 120,
      "description": "IR: Current firewall rules"
    },
    "ir_hash_executables": {
      "query": "SELECT path, md5, sha256, sha1 FROM hash WHERE path IN (SELECT path FROM processes WHERE path != '');",
      "interval": 300,
      "description": "IR: Hash all running executable paths"
    },
    "ir_etc_hosts": {
      "query": "SELECT * FROM etc_hosts;",
      "interval": 120,
      "description": "IR: /etc/hosts (DNS hijack detection)"
    }
  }
}
