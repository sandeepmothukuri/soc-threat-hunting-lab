{
  "queries": {
    "proc_net_activity": {
      "query": "SELECT p.name, p.pid, p.path, p.cmdline, p.uid, n.local_address, n.local_port, n.remote_address, n.remote_port, n.state FROM process_open_sockets n JOIN processes p ON n.pid = p.pid WHERE n.remote_port IN (4444,4445,1234,5555,6666,7777,8080,8443,8888,9001,9030,1337,31337,12345,54321) AND n.state = 'ESTABLISHED';",
      "interval": 60,
      "description": "Processes with C2/backdoor port connections",
      "mitre": "T1071"
    },
    "shell_from_webserver": {
      "query": "SELECT p.name, p.pid, p.cmdline, p.parent, pp.name AS parent_name, pp.cmdline AS parent_cmdline FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE p.name IN ('bash','sh','zsh','dash','python','python3','perl','ruby','nc','ncat') AND pp.name IN ('apache2','nginx','httpd','php','php-fpm','node','tomcat','java');",
      "interval": 60,
      "description": "Webshell detection - shell spawned by web server",
      "mitre": "T1505.003"
    },
    "suspicious_cron": {
      "query": "SELECT * FROM crontab WHERE command LIKE '%/tmp/%' OR command LIKE '%/dev/shm/%' OR command LIKE '%curl%' OR command LIKE '%wget%' OR command LIKE '%bash -i%' OR command LIKE '%nc %' OR command LIKE '%python%' OR command LIKE '%perl%';",
      "interval": 300,
      "description": "Suspicious cron persistence - T1053.003",
      "mitre": "T1053.003"
    },
    "new_suid_binaries": {
      "query": "SELECT path, username, permissions, inode, uid, gid FROM suid_bin WHERE path NOT IN ('/usr/bin/sudo','/usr/bin/passwd','/usr/bin/pkexec','/usr/bin/chsh','/usr/bin/chfn','/usr/bin/gpasswd','/usr/bin/newgrp','/bin/su','/bin/ping','/bin/mount','/bin/umount','/sbin/unix_chkpwd');",
      "interval": 300,
      "description": "Non-standard SUID binaries - possible privesc",
      "mitre": "T1548.001"
    },
    "new_listening_ports": {
      "query": "SELECT DISTINCT l.port, l.protocol, l.address, p.name, p.pid, p.cmdline, p.path FROM listening_ports l JOIN processes p ON l.pid = p.pid WHERE l.port NOT IN (22,80,443,53,123,3306,5432,6379,8080,8443,9200,9300,5601,55000,1514,1515,3000,8000,8889) AND l.port > 1024;",
      "interval": 120,
      "description": "Unexpected new listening ports - backdoor/RAT detection",
      "mitre": "T1049"
    },
    "privesc_attempt": {
      "query": "SELECT uid, user, time, host, tty, command FROM shell_history WHERE command LIKE '%sudo%' OR command LIKE '%chmod 777%' OR command LIKE '%chmod +s%' OR command LIKE '%chown root%' OR command LIKE '%insmod%' OR command LIKE '%modprobe%';",
      "interval": 300,
      "description": "Privilege escalation command history",
      "mitre": "T1068"
    },
    "ssh_authorized_keys_change": {
      "query": "SELECT uid, username, key_type, key_file, comment FROM authorized_keys WHERE key_file != '';",
      "interval": 600,
      "description": "SSH authorized_keys monitoring - backdoor persistence",
      "mitre": "T1098.004"
    },
    "hidden_files_tmp": {
      "query": "SELECT path, uid, gid, mode, mtime, atime, ctime, size FROM file WHERE path LIKE '/tmp/.%' OR path LIKE '/dev/shm/.%' OR path LIKE '/var/tmp/.%';",
      "interval": 300,
      "description": "Hidden files in temp directories - malware staging",
      "mitre": "T1564.001"
    },
    "ld_preload": {
      "query": "SELECT * FROM process_envs WHERE key = 'LD_PRELOAD' AND value != '';",
      "interval": 120,
      "description": "LD_PRELOAD injection detection - T1574.006",
      "mitre": "T1574.006"
    },
    "memory_only_processes": {
      "query": "SELECT pid, name, path, cmdline, uid FROM processes WHERE (path = '' OR path LIKE '%(deleted)%' OR path LIKE '/tmp/%' OR path LIKE '/dev/shm/%') AND name NOT IN ('kworker','ksoftirqd','migration','rcu_sched','rcu_bh','watchdog');",
      "interval": 120,
      "description": "Fileless malware / processes from deleted or temp paths",
      "mitre": "T1055"
    },
    "user_creation": {
      "query": "SELECT uid, username, gid, shell, directory FROM users WHERE uid >= 1000 AND shell IN ('/bin/bash','/bin/sh','/bin/zsh','/bin/dash');",
      "interval": 600,
      "description": "New user account detection",
      "mitre": "T1136.001"
    },
    "dns_over_non_standard": {
      "query": "SELECT p.name, p.pid, p.cmdline, n.remote_address, n.remote_port FROM process_open_sockets n JOIN processes p ON n.pid = p.pid WHERE n.remote_port = 53 AND p.name NOT IN ('systemd-resolve','dnsmasq','unbound','bind','named','dhclient','NetworkManager');",
      "interval": 120,
      "description": "Non-standard process making DNS queries - DNS tunneling T1071.004",
      "mitre": "T1071.004"
    }
  }
}
